<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Curious little friends</title>
  <desc id="desc">An original cartoon of a friendly fox and bear sharing a bright picture book.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff0ca"/><stop offset="1" stop-color="#dff0dd"/></linearGradient></defs>
  <style>
    @keyframes friend-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes page-flutter { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }
    .fox { animation: friend-bob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .bear { animation: friend-bob 3.5s ease-in-out .3s infinite; transform-box: fill-box; transform-origin: center bottom; }
    .book { animation: page-flutter 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
