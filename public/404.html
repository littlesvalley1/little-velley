<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    <title>Page not found | Little's Valley Preparatory School</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .not-found {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        padding: 28px;
        text-align: center;
      }

      .not-found p {
        margin: 0;
        color: #52645b;
        font-size: 13px;
        line-height: 1.7;
      }

      .not-found h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(39px, 7vw, 62px);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <a class="brand" href="/" aria-label="Little's Valley Preparatory School home">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span class="brand-copy">
          <span class="brand-name">Little's Valley</span>
          <span class="brand-type">Preparatory School · Delhi</span>
        </span>
      </a>
      <h1>Looks like a wrong turn.</h1>
      <p>That page isn't here. Head back to the school homepage to find the way.</p>
      <a class="button button-primary" href="/">Back to the homepage <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
